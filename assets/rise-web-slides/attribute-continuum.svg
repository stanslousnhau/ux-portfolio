<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8fc"/><stop offset="1" stop-color="#eef2fb"/></linearGradient><style>
text{font-family:Inter,Arial,sans-serif;fill:#14213d}.eyebrow{font-size:25px;font-weight:800;letter-spacing:3px;fill:#3268f5}.title{font-size:58px;font-weight:800;letter-spacing:-1.5px}.sub{font-size:27px;fill:#52617b}.label{font-size:24px;font-weight:800;letter-spacing:1.4px;fill:#3268f5}.body{font-size:26px;fill:#43516a}.small{font-size:21px;fill:#596780}.line{stroke:#cbd5e8;stroke-width:4}.end{font-size:20px;font-weight:700;fill:#52617b;letter-spacing:.5px}
</style></defs>
<rect width="1920" height="1180" fill="url(#bg)"/>
<text x="100" y="100" class="eyebrow">RISE · RESEARCH SYNTHESIS</text>
<text x="100" y="185" class="title">From recurring behaviours to the “Cautious Provider”</text>
<text x="100" y="238" class="sub">A working archetype shaped by the pressures, priorities and decision patterns identified in secondary research.</text>
<rect x="80" y="285" width="1760" height="720" rx="28" fill="#fff" stroke="#dce3f0" stroke-width="2"/>
<text x="135" y="355" class="eyebrow">ATTRIBUTE CONTINUUM</text>
<text x="135" y="400" class="small">The synthesis moves from short-term coping towards careful, security-seeking financial behaviour.</text>
<text x="135" y="485" class="label">TIME HORIZON</text><text x="430" y="485" class="body">Immediate decisions</text><text x="1740" y="485" text-anchor="end" class="body">Plans around payday and upcoming commitments</text><line x1="435" y1="515" x2="1740" y2="515" class="line"/><circle cx="1452.9" cy="515" r="15" fill="#3268f5" stroke="#dce7ff" stroke-width="9"/><text x="435" y="552" class="end">COPING</text><text x="1740" y="552" text-anchor="end" class="end">CAUTIOUS / PREPARED</text><text x="135" y="597" class="label">RISK RESPONSE</text><text x="430" y="597" class="body">Uses money when it is available</text><text x="1740" y="597" text-anchor="end" class="body">Protects a small reserve against surprises</text><line x1="435" y1="627" x2="1740" y2="627" class="line"/><circle cx="1531.2" cy="627" r="15" fill="#3268f5" stroke="#dce7ff" stroke-width="9"/><text x="435" y="664" class="end">COPING</text><text x="1740" y="664" text-anchor="end" class="end">CAUTIOUS / PREPARED</text><text x="135" y="709" class="label">DECISION STYLE</text><text x="430" y="709" class="body">Acts with limited visibility</text><text x="1740" y="709" text-anchor="end" class="body">Wants clear information before committing</text><line x1="435" y1="739" x2="1740" y2="739" class="line"/><circle cx="1479.0" cy="739" r="15" fill="#3268f5" stroke="#dce7ff" stroke-width="9"/><text x="435" y="776" class="end">COPING</text><text x="1740" y="776" text-anchor="end" class="end">CAUTIOUS / PREPARED</text><text x="135" y="821" class="label">SUPPORT NEED</text><text x="430" y="821" class="body">Relies on trial and error</text><text x="1740" y="821" text-anchor="end" class="body">Values reassurance and practical guidance</text><line x1="435" y1="851" x2="1740" y2="851" class="line"/><circle cx="1413.8" cy="851" r="15" fill="#3268f5" stroke="#dce7ff" stroke-width="9"/><text x="435" y="888" class="end">COPING</text><text x="1740" y="888" text-anchor="end" class="end">CAUTIOUS / PREPARED</text><text x="135" y="933" class="label">MOTIVATION</text><text x="430" y="933" class="body">Wants to get through today</text><text x="1740" y="933" text-anchor="end" class="body">Wants to provide reliably and stay in control</text><line x1="435" y1="963" x2="1740" y2="963" class="line"/><circle cx="1570.3" cy="963" r="15" fill="#3268f5" stroke="#dce7ff" stroke-width="9"/><text x="435" y="1000" class="end">COPING</text><text x="1740" y="1000" text-anchor="end" class="end">CAUTIOUS / PREPARED</text><rect x="135" y="920" width="1650" height="1.5" fill="#e4e9f2"/>
<text x="135" y="965" font-size="31" font-weight="800" fill="#14213d">Archetype: The Cautious Provider</text>
<text x="135" y="1008" font-size="24" fill="#43516a">A first-job earner who wants to meet responsibilities, protect a modest buffer and feel confident before spending.</text>
<text x="100" y="1100" class="small">Interpretation, not a measured segmentation: continuum positions are a design hypothesis to validate with first-job earners.</text>
</svg>