<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8fc"/><stop offset="1" stop-color="#eef2fb"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#14213d}.eyebrow{font-size:24px;font-weight:700;letter-spacing:4px;fill:#3268f5}.title{font-size:62px;font-weight:800;letter-spacing:-1.5px}.sub{font-size:27px;fill:#52617b}.head{font-size:26px;font-weight:800}.body{font-size:23px;fill:#43516a}.small{font-size:20px;fill:#596780}.label{font-size:19px;font-weight:800;letter-spacing:1.5px;fill:#3268f5}.line{stroke:#cbd5e8;stroke-width:3}.blue{fill:#3268f5}.white{fill:#fff}.muted{fill:#64728b}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="100" y="95" class="eyebrow">RISE · RESEARCH SYNTHESIS</text><text x="100" y="180" class="title">From recurring behaviours to the “Cautious Provider”</text><text x="100" y="235" class="sub">A working archetype built by clustering the pressures, priorities and decision patterns surfaced in secondary research.</text>
<rect x="100" y="285" width="1720" height="610" rx="28" fill="#fff" stroke="#dce3f0" stroke-width="2"/>
<text x="150" y="345" class="label">ATTRIBUTE CONTINUUM</text><text x="150" y="390" class="small">The synthesis moves from short-term coping towards careful, security-seeking financial behaviour.</text>
<text x="150" y="465" class="label">TIME HORIZON</text><text x="430" y="465" class="body">Immediate decisions</text><text x="1490" y="465" text-anchor="end" class="body">Plans around payday and upcoming commitments</text><line x1="455" y1="499" x2="1450" y2="499" class="line"/><circle cx="1231.1" cy="499" r="13" fill="#3268f5" stroke="#dce7ff" stroke-width="8"/><text x="455" y="533" class="small">COPING</text><text x="1450" y="533" text-anchor="end" class="small">CAUTIOUS / PREPARED</text><text x="150" y="561" class="label">RISK RESPONSE</text><text x="430" y="561" class="body">Uses money when it is available</text><text x="1490" y="561" text-anchor="end" class="body">Protects a small reserve against surprises</text><line x1="455" y1="595" x2="1450" y2="595" class="line"/><circle cx="1290.8" cy="595" r="13" fill="#3268f5" stroke="#dce7ff" stroke-width="8"/><text x="455" y="629" class="small">COPING</text><text x="1450" y="629" text-anchor="end" class="small">CAUTIOUS / PREPARED</text><text x="150" y="657" class="label">DECISION STYLE</text><text x="430" y="657" class="body">Acts with limited visibility</text><text x="1490" y="657" text-anchor="end" class="body">Wants clear information before committing</text><line x1="455" y1="691" x2="1450" y2="691" class="line"/><circle cx="1251.0" cy="691" r="13" fill="#3268f5" stroke="#dce7ff" stroke-width="8"/><text x="455" y="725" class="small">COPING</text><text x="1450" y="725" text-anchor="end" class="small">CAUTIOUS / PREPARED</text><text x="150" y="753" class="label">SUPPORT NEED</text><text x="430" y="753" class="body">Relies on trial and error</text><text x="1490" y="753" text-anchor="end" class="body">Values reassurance and practical guidance</text><line x1="455" y1="787" x2="1450" y2="787" class="line"/><circle cx="1191.3" cy="787" r="13" fill="#3268f5" stroke="#dce7ff" stroke-width="8"/><text x="455" y="821" class="small">COPING</text><text x="1450" y="821" text-anchor="end" class="small">CAUTIOUS / PREPARED</text><text x="150" y="849" class="label">MOTIVATION</text><text x="430" y="849" class="body">Wants to get through today</text><text x="1490" y="849" text-anchor="end" class="body">Wants to provide reliably and stay in control</text><line x1="455" y1="883" x2="1450" y2="883" class="line"/><circle cx="1330.6" cy="883" r="13" fill="#3268f5" stroke="#dce7ff" stroke-width="8"/><text x="455" y="917" class="small">COPING</text><text x="1450" y="917" text-anchor="end" class="small">CAUTIOUS / PREPARED</text><rect x="150" y="825" width="1620" height="1" fill="#e4e9f2"/><text x="150" y="865" class="head">Archetype name: The Cautious Provider</text><text x="650" y="865" class="body">A first-job earner who wants to meet responsibilities, protect a modest buffer and feel confident before spending.</text>
<text x="100" y="970" class="small">Interpretation, not a measured segmentation: positions show the design hypothesis used to guide the concept and should be validated with first-job earners.</text></svg>