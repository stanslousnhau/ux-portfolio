<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><style>
.t{font-family:Inter,Arial,sans-serif;fill:#14213d}.muted{fill:#596782}.small{font-size:22px}.body{font-size:25px}.head{font-size:34px;font-weight:800}.panel{fill:#fff;stroke:#d8e0ed;stroke-width:3}.num{font-size:22px;font-weight:800;fill:#315fc4}.bubble{fill:#eaf0ff;stroke:#c9d7fa;stroke-width:2}.bubbletext{font-size:22px;font-weight:600;fill:#20345f}.skin{fill:#8b573d}.shirt{fill:#315fc4}.dark{fill:#17243a}.accent{fill:#f3b64b}.line{stroke:#17243a;stroke-width:6;stroke-linecap:round;fill:none}.phone{fill:#17243a;stroke:#17243a;stroke-width:5}.screen{fill:#f8faff}
</style></defs>
<rect width="1920" height="1080" fill="#f4f6fb"/>
<text x="100" y="95" class="t" font-size="24" font-weight="800" letter-spacing="5">RISE · THE HUMAN STORY</text>
<text x="100" y="165" class="t" font-size="58" font-weight="800">A first paycheck. A month of decisions.</text>
<text x="100" y="210" class="t muted" font-size="27">A storyboard showing the everyday pressure RISE is designed to help Thabo navigate.</text>
<!-- panel backgrounds -->
<g>
<rect class="panel" x="90" y="270" width="550" height="330" rx="20"/><rect class="panel" x="685" y="270" width="550" height="330" rx="20"/><rect class="panel" x="1280" y="270" width="550" height="330" rx="20"/>
<rect class="panel" x="90" y="635" width="550" height="330" rx="20"/><rect class="panel" x="685" y="635" width="550" height="330" rx="20"/><rect class="panel" x="1280" y="635" width="550" height="330" rx="20"/>
</g>
<!-- scene 1 -->
<g transform="translate(120 305)"><text class="num" x="0" y="0">01 · PAYDAY</text><rect x="15" y="45" width="185" height="100" rx="12" fill="#eaf4ed"/><text class="t small" x="32" y="82">SALARY IN</text><text class="t" x="32" y="122" font-size="34" font-weight="800">R12 500</text><circle cx="300" cy="105" r="45" class="skin"/><path d="M255 93 Q260 40 305 50 Q347 54 345 96" class="dark"/><path d="M240 245 Q245 160 300 160 Q355 160 365 245Z" class="shirt"/><path d="M275 108 Q300 125 325 108" class="line"/><rect class="bubble" x="380" y="45" width="125" height="78" rx="18"/><text class="bubbletext" x="398" y="78">Finally!</text><text class="bubbletext" x="398" y="105">I can plan.</text><text class="t muted small" x="0" y="290">Thabo feels hopeful when his first salary arrives.</text></g>
<!-- scene 2 -->
<g transform="translate(715 305)"><text class="num" x="0" y="0">02 · COMMITMENTS</text><circle cx="100" cy="125" r="39" class="skin"/><path d="M62 115 Q68 68 108 77 Q142 80 140 117" class="dark"/><path d="M50 245 Q54 170 101 170 Q151 170 160 245Z" class="shirt"/><rect x="210" y="55" width="280" height="170" rx="14" fill="#f8faff" stroke="#d8e0ed" stroke-width="3"/><text class="t small" x="235" y="92" font-weight="800">MONTHLY COSTS</text><text class="t small" x="235" y="132">Rent · R4 000</text><text class="t small" x="235" y="165">Transport · R1 200</text><text class="t small" x="235" y="198">Family · R1 500</text><path d="M150 125 L195 125" stroke="#315fc4" stroke-width="5"/><text class="t muted small" x="0" y="290">Rent, transport and family support claim their share.</text></g>
<!-- scene 3 -->
<g transform="translate(1310 305)"><text class="num" x="0" y="0">03 · THE SURPRISE</text><circle cx="105" cy="125" r="40" class="skin"/><path d="M66 114 Q70 70 108 77 Q142 82 145 116" class="dark"/><path d="M55 245 Q60 170 106 170 Q154 170 164 245Z" class="shirt"/><rect x="215" y="55" width="270" height="170" rx="14" fill="#fff5e8" stroke="#f1d4a6" stroke-width="3"/><text class="t small" x="240" y="95" font-weight="800">UNEXPECTED</text><text class="t small" x="240" y="135">Taxi costs rise</text><text class="t small" x="240" y="175">+ family request</text><path d="M270 195 l18 -22 18 22" fill="none" stroke="#c47b24" stroke-width="5"/><text class="t muted small" x="0" y="290">An unexpected expense disrupts the plan.</text></g>
<!-- scene 4 -->
<g transform="translate(120 670)"><text class="num" x="0" y="0">04 · THE WORRY</text><circle cx="105" cy="125" r="40" class="skin"/><path d="M66 114 Q70 70 108 77 Q142 82 145 116" class="dark"/><path d="M55 245 Q60 170 106 170 Q154 170 164 245Z" class="shirt"/><path d="M87 115 Q105 105 123 115" stroke="#17243a" stroke-width="5" fill="none"/><rect class="bubble" x="215" y="55" width="280" height="150" rx="18"/><text class="bubbletext" x="240" y="100">Will I have</text><text class="bubbletext" x="240" y="132">enough left before</text><text class="bubbletext" x="240" y="164">the next payday?</text><text class="t muted small" x="0" y="290">He is unsure what is safe to spend or protect.</text></g>
<!-- scene 5 -->
<g transform="translate(715 670)"><text class="num" x="0" y="0">05 · A CLEARER PICTURE</text><circle cx="95" cy="125" r="38" class="skin"/><path d="M58 114 Q62 70 98 77 Q132 82 135 116" class="dark"/><path d="M48 245 Q52 170 96 170 Q145 170 153 245Z" class="shirt"/><rect class="phone" x="210" y="42" width="135" height="205" rx="18"/><rect class="screen" x="220" y="55" width="115" height="178" rx="10"/><text class="t" x="232" y="84" font-size="15" font-weight="800">RISE</text><text class="t muted" x="232" y="111" font-size="13">SAFE TO SPEND</text><text class="t" x="232" y="143" font-size="25" font-weight="800">R1 250</text><rect x="230" y="160" width="95" height="45" rx="8" fill="#e5f2e9"/><text x="239" y="178" font-size="11" fill="#276443">BUFFER</text><text x="239" y="196" font-size="18" font-weight="800" fill="#276443">R500</text><rect x="375" y="70" width="125" height="100" rx="14" fill="#eaf4ed"/><text class="t small" x="392" y="108" font-weight="800">VISIBLE</text><text class="t small" x="392" y="140">buffer</text><text class="t muted small" x="0" y="290">RISE makes upcoming commitments and the Buffer visible.</text></g>
<!-- scene 6 -->
<g transform="translate(1310 670)"><text class="num" x="0" y="0">06 · MORE CONTROL</text><circle cx="105" cy="125" r="40" class="skin"/><path d="M66 114 Q70 70 108 77 Q142 82 145 116" class="dark"/><path d="M55 245 Q60 170 106 170 Q154 170 164 245Z" class="shirt"/><path d="M80 130 Q105 145 130 130" stroke="#17243a" stroke-width="5" fill="none"/><rect x="215" y="55" width="280" height="150" rx="18" fill="#eaf4ed" stroke="#c8e2d1" stroke-width="3"/><text class="t" x="240" y="100" font-size="23" font-weight="800">Plan with confidence</text><text class="t small" x="240" y="140">Protect what matters.</text><text class="t small" x="240" y="175">Choose what comes next.</text><text class="t muted small" x="0" y="290">He can make informed choices without losing flexibility.</text></g>

</svg>
