<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <style>
  text{font-family:Inter,Arial,sans-serif;fill:#17243b}
  .eyebrow{font-size:22px;font-weight:800;letter-spacing:3px;fill:#315ff4}
  .title{font-size:54px;font-weight:800;letter-spacing:-1px}
  .subtitle{font-size:23px;fill:#5c687c}
  .stage{font-size:22px;font-weight:800;fill:#fff}
  .rowlabel{font-size:18px;font-weight:800;letter-spacing:1px;fill:#315ff4}
  .cell{font-size:19px;fill:#27364e}
  .emotion{font-size:20px;font-weight:700;fill:#27364e}
  .muted{font-size:17px;fill:#69758a}
  .grid{stroke:#dce3ee;stroke-width:2}
 </style>
</defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="76" y="66" class="eyebrow">VELOCITY · TARGET-STATE USER JOURNEY</text>
<text x="76" y="132" class="title">A smoother fuel stop, with rewards that feel useful</text>
<text x="76" y="176" class="subtitle">The intended end-to-end experience, from arriving at the station to recognising the attendant.</text>

<!-- table frame -->
<rect x="76" y="220" width="1768" height="590" rx="14" fill="#fff" stroke="#dce3ee" stroke-width="2"/>
<!-- left label rail -->
<rect x="76" y="220" width="190" height="590" rx="14" fill="#f3f6fc"/>
<rect x="252" y="220" width="1592" height="92" fill="#142b60"/>
<!-- column separators -->
<path d="M266 220V810 M583 220V810 M900 220V810 M1217 220V810 M1534 220V810" class="grid"/>
<path d="M76 312H1844 M76 438H1844 M76 564H1844 M76 690H1844" class="grid"/>

<!-- stage headers -->
<text x="284" y="258" class="stage">01 · ARRIVE</text><text x="284" y="287" font-size="18" fill="#dce6ff">At the station</text>
<text x="601" y="258" class="stage">02 · PREPARE</text><text x="601" y="287" font-size="18" fill="#dce6ff">Get ready to pay</text>
<text x="918" y="258" class="stage">03 · PURCHASE</text><text x="918" y="287" font-size="18" fill="#dce6ff">Fuel and earn</text>
<text x="1235" y="258" class="stage">04 · USE REWARDS</text><text x="1235" y="287" font-size="18" fill="#dce6ff">Choose what works</text>
<text x="1552" y="258" class="stage">05 · THANK</text><text x="1552" y="287" font-size="18" fill="#dce6ff">Tip and finish</text>

<!-- row labels -->
<text x="96" y="367" class="rowlabel">USER</text><text x="96" y="392" class="rowlabel">ACTIONS</text>
<text x="96" y="493" class="rowlabel">TOUCHPOINTS</text>
<text x="96" y="619" class="rowlabel">MOMENT OF</text><text x="96" y="644" class="rowlabel">TRUTH</text>
<text x="96" y="746" class="rowlabel">DESIRED</text><text x="96" y="771" class="rowlabel">OUTCOME</text>

<!-- actions -->
<g class="cell">
 <text x="284" y="354"><tspan x="284">Open the app and</tspan><tspan x="284" dy="25">check the rewards</tspan><tspan x="284" dy="25">balance and station.</tspan></text>
 <text x="601" y="354"><tspan x="601">Select fuel amount</tspan><tspan x="601" dy="25">and preferred payment</tspan><tspan x="601" dy="25">method.</tspan></text>
 <text x="918" y="354"><tspan x="918">Pay for fuel and</tspan><tspan x="918" dy="25">check that points or</tspan><tspan x="918" dy="25">rewards are credited.</tspan></text>
 <text x="1235" y="354"><tspan x="1235">Review the balance;</tspan><tspan x="1235" dy="25">redeem, save or cash</tspan><tspan x="1235" dy="25">out where eligible.</tspan></text>
 <text x="1552" y="354"><tspan x="1552">Choose a tip amount,</tspan><tspan x="1552" dy="25">confirm and check the</tspan><tspan x="1552" dy="25">thank-you is received.</tspan></text>
</g>
<!-- touchpoints -->
<g class="cell">
 <text x="284" y="480"><tspan x="284">App home</tspan><tspan x="284" dy="25">Station signage</tspan></text>
 <text x="601" y="480"><tspan x="601">App payment</tspan><tspan x="601" dy="25">Pump · attendant</tspan></text>
 <text x="918" y="480"><tspan x="918">Payment terminal</tspan><tspan x="918" dy="25">Digital receipt</tspan></text>
 <text x="1235" y="480"><tspan x="1235">Rewards wallet</tspan><tspan x="1235" dy="25">Redemption options</tspan></text>
 <text x="1552" y="480"><tspan x="1552">Pay-it-forward flow</tspan><tspan x="1552" dy="25">Attendant confirmation</tspan></text>
</g>
<!-- moments of truth -->
<g class="cell">
 <text x="284" y="606"><tspan x="284">Can I quickly see</tspan><tspan x="284" dy="25">what I have and</tspan><tspan x="284" dy="25">what is available?</tspan></text>
 <text x="601" y="606"><tspan x="601">Can I pay my way</tspan><tspan x="601" dy="25">without extra steps</tspan><tspan x="601" dy="25">or confusion?</tspan></text>
 <text x="918" y="606"><tspan x="918">Are my rewards</tspan><tspan x="918" dy="25">credited accurately</tspan><tspan x="918" dy="25">and promptly?</tspan></text>
 <text x="1235" y="606"><tspan x="1235">Can I use the value</tspan><tspan x="1235" dy="25">in a way that fits</tspan><tspan x="1235" dy="25">my needs?</tspan></text>
 <text x="1552" y="606"><tspan x="1552">Did my tip reach</tspan><tspan x="1552" dy="25">the right person,</tspan><tspan x="1552" dy="25">with confirmation?</tspan></text>
</g>
<!-- outcome -->
<g class="cell" font-weight="700">
 <text x="284" y="754">Oriented</text><text x="601" y="754">Ready</text><text x="918" y="754">Reassured</text><text x="1235" y="754">In control</text><text x="1552" y="754">Appreciative</text>
</g>

<!-- emotional journey -->
<text x="78" y="866" class="eyebrow">EMOTIONAL JOURNEY</text>
<text x="78" y="900" class="muted">Customer confidence</text>
<rect x="266" y="840" width="1578" height="178" rx="14" fill="#f7f9fd" stroke="#e1e7f1" stroke-width="2"/>
<!-- chart grid -->
<path d="M310 974H1800 M310 926H1800 M310 878H1800" stroke="#e0e6f0" stroke-width="2" stroke-dasharray="5 8"/>
<text x="278" y="980" class="muted" text-anchor="end">Low</text><text x="278" y="884" class="muted" text-anchor="end">High</text>
<!-- rising emotional line -->
<path d="M360 964 C470 954 500 954 640 946 S800 930 930 920 S1100 904 1220 896 S1450 876 1570 868 S1730 856 1780 850" fill="none" stroke="#315ff4" stroke-width="7" stroke-linecap="round"/>
<path d="M360 964 C470 954 500 954 640 946 S800 930 930 920 S1100 904 1220 896 S1450 876 1570 868 S1730 856 1780 850 L1780 1000 L360 1000Z" fill="#315ff4" opacity=".08"/>
<g fill="#fff" stroke="#315ff4" stroke-width="5">
 <circle cx="360" cy="964" r="10"/><circle cx="710" cy="941" r="10"/><circle cx="1060" cy="912" r="10"/><circle cx="1410" cy="883" r="10"/><circle cx="1780" cy="850" r="10"/>
</g>
<g class="emotion" text-anchor="middle">
 <text x="360" y="946">Unsure</text><text x="710" y="922">Focused</text><text x="1060" y="893">Reassured</text><text x="1410" y="864">Confident</text><text x="1780" y="831">Appreciated</text>
</g>
<text x="78" y="1050" class="muted">Target-state hypothesis: the emotional curve represents the intended direction of the experience, not measured user-research data.</text>
</svg>
