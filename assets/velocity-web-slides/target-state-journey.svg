<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8fc"/><stop offset="1" stop-color="#eef2fb"/></linearGradient><style>text{font-family:Inter,Arial,sans-serif;fill:#14213d}.eyebrow{font-size:24px;font-weight:700;letter-spacing:4px;fill:#3268f5}.title{font-size:62px;font-weight:800;letter-spacing:-1.5px}.sub{font-size:27px;fill:#52617b}.head{font-size:26px;font-weight:800}.body{font-size:23px;fill:#43516a}.small{font-size:20px;fill:#596780}.label{font-size:19px;font-weight:800;letter-spacing:1.5px;fill:#3268f5}.line{stroke:#cbd5e8;stroke-width:3}.blue{fill:#3268f5}.white{fill:#fff}.muted{fill:#64728b}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="100" y="95" class="eyebrow">VELOCITY · TARGET-STATE EXPERIENCE</text><text x="100" y="180" class="title">A rewards journey built around a real fuel stop</text><text x="100" y="235" class="sub">The intended experience: make rewards visible, usable in the moment and flexible enough to include a thank-you to the attendant.</text>
<rect x="100" y="310" width="326" height="565" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><rect x="100" y="310" width="326" height="74" rx="22" fill="#132b61"/><rect x="100" y="362" width="326" height="22" fill="#132b61"/><text x="124" y="357" font-size="20" font-weight="800" fill="#fff">01 · ARRIVE</text><text x="124" y="432" class="head">Arrive at station</text><text x="124" y="480" class="label">USER ACTIONS</text><foreignObject x="124" y="494" width="278" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px Arial,sans-serif;color:#43516a;line-height:1.35">Open the app; check nearby station and current rewards balance.</div></foreignObject><text x="124" y="630" class="label">TOUCHPOINTS</text><foreignObject x="124" y="644" width="278" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial,sans-serif;color:#43516a;line-height:1.3">App home · station signage</div></foreignObject><text x="124" y="730" class="label">MOMENT OF TRUTH</text><foreignObject x="124" y="744" width="278" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px Arial,sans-serif;color:#43516a;line-height:1.28">Can I quickly understand what I have and what I can do here?</div></foreignObject><text x="124" y="845" font-size="34">🙂</text><text x="180" y="842" class="head">Oriented</text><rect x="448" y="310" width="326" height="565" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><rect x="448" y="310" width="326" height="74" rx="22" fill="#132b61"/><rect x="448" y="362" width="326" height="22" fill="#132b61"/><text x="472" y="357" font-size="20" font-weight="800" fill="#fff">02 · PREPARE</text><text x="472" y="432" class="head">Get ready to pay</text><text x="472" y="480" class="label">USER ACTIONS</text><foreignObject x="472" y="494" width="278" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px Arial,sans-serif;color:#43516a;line-height:1.35">Choose fuel amount and preferred payment method; present app or scan code.</div></foreignObject><text x="472" y="630" class="label">TOUCHPOINTS</text><foreignObject x="472" y="644" width="278" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial,sans-serif;color:#43516a;line-height:1.3">App payment · pump · attendant</div></foreignObject><text x="472" y="730" class="label">MOMENT OF TRUTH</text><foreignObject x="472" y="744" width="278" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px Arial,sans-serif;color:#43516a;line-height:1.28">Does payment work with the method I prefer, without extra friction?</div></foreignObject><text x="472" y="845" font-size="34">😐</text><text x="528" y="842" class="head">Focused</text><rect x="796" y="310" width="326" height="565" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><rect x="796" y="310" width="326" height="74" rx="22" fill="#132b61"/><rect x="796" y="362" width="326" height="22" fill="#132b61"/><text x="820" y="357" font-size="20" font-weight="800" fill="#fff">03 · EARN</text><text x="820" y="432" class="head">Complete fuel purchase</text><text x="820" y="480" class="label">USER ACTIONS</text><foreignObject x="820" y="494" width="278" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px Arial,sans-serif;color:#43516a;line-height:1.35">Confirm transaction and see points/rewards update.</div></foreignObject><text x="820" y="630" class="label">TOUCHPOINTS</text><foreignObject x="820" y="644" width="278" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial,sans-serif;color:#43516a;line-height:1.3">POS · app transaction receipt</div></foreignObject><text x="820" y="730" class="label">MOMENT OF TRUTH</text><foreignObject x="820" y="744" width="278" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px Arial,sans-serif;color:#43516a;line-height:1.28">Are my rewards credited accurately and immediately?</div></foreignObject><text x="820" y="845" font-size="34">🙂</text><text x="876" y="842" class="head">Reassured</text><rect x="1144" y="310" width="326" height="565" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><rect x="1144" y="310" width="326" height="74" rx="22" fill="#132b61"/><rect x="1144" y="362" width="326" height="22" fill="#132b61"/><text x="1168" y="357" font-size="20" font-weight="800" fill="#fff">04 · USE VALUE</text><text x="1168" y="432" class="head">Choose how to use rewards</text><text x="1168" y="480" class="label">USER ACTIONS</text><foreignObject x="1168" y="494" width="278" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px Arial,sans-serif;color:#43516a;line-height:1.35">Review balance; redeem, save or cash out where eligible.</div></foreignObject><text x="1168" y="630" class="label">TOUCHPOINTS</text><foreignObject x="1168" y="644" width="278" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial,sans-serif;color:#43516a;line-height:1.3">Rewards wallet · redemption options</div></foreignObject><text x="1168" y="730" class="label">MOMENT OF TRUTH</text><foreignObject x="1168" y="744" width="278" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px Arial,sans-serif;color:#43516a;line-height:1.28">Can I use value in a way that suits my needs right now?</div></foreignObject><text x="1168" y="845" font-size="34">😊</text><text x="1224" y="842" class="head">In control</text><rect x="1492" y="310" width="326" height="565" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><rect x="1492" y="310" width="326" height="74" rx="22" fill="#132b61"/><rect x="1492" y="362" width="326" height="22" fill="#132b61"/><text x="1516" y="357" font-size="20" font-weight="800" fill="#fff">05 · THANK</text><text x="1516" y="432" class="head">Tip attendant &amp; finish</text><text x="1516" y="480" class="label">USER ACTIONS</text><foreignObject x="1516" y="494" width="278" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px Arial,sans-serif;color:#43516a;line-height:1.35">Choose a tip amount, confirm, and receive a clear confirmation.</div></foreignObject><text x="1516" y="630" class="label">TOUCHPOINTS</text><foreignObject x="1516" y="644" width="278" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font:20px Arial,sans-serif;color:#43516a;line-height:1.3">Pay-it-forward flow · attendant confirmation</div></foreignObject><text x="1516" y="730" class="label">MOMENT OF TRUTH</text><foreignObject x="1516" y="744" width="278" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px Arial,sans-serif;color:#43516a;line-height:1.28">Did my thank-you reach the right person, and is it clear that it did?</div></foreignObject><text x="1516" y="845" font-size="34">🥰</text><text x="1572" y="842" class="head">Appreciative</text><rect x="100" y="915" width="1720" height="85" rx="18" fill="#e4ebff"/><text x="130" y="968" class="head">Experience principle</text><text x="440" y="968" class="body">Every step should reduce uncertainty and give customers visible control over their rewards and choices.</text><text x="100" y="1040" class="small">Target-state hypothesis for design exploration; validate task completion, payment compatibility, reward timing and tipping operations in station-based research.</text></svg>